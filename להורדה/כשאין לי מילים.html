document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

transition:width .12s linear}\n\n/* ---------- side dot nav ---------- */\n.dotnav{position:fixed;top:50%;right:24px;transform:translateY(-50%);z-index:55;display:flex;flex-direction:column;gap:14px}\n.dotnav a{position:relative;width:11px;height:11px;border-radius:50%;border:1.5px solid var(--sage);background:transparent;transition:.25s;display:block}\n.dotnav a:hover,.dotnav a.active{background:var(--sage);transform:scale(1.25)}\n.dotnav a span{position:absolute;right:22px;top:50%;transform:translateY(-50%);white-space:nowrap;font-size:13px;color:var(--sage-deep);background:var(--paper);padding:3px 11px;border-radius:30px;border:1px solid var(--line);opacity:0;pointer-events:none;transition:.25s;box-shadow:0 4px 14px rgba(94,110,86,.12)}\n.dotnav a:hover span{opacity:1}\n@media(max-width:1080px){.dotnav{display:none}}\n\n/* ---------- decorative ---------- */\n.sun{display:block;color:var(--gold)}\n.leaf-corner{position:absolute;pointer-events:none;opacity:.5;color:var(--sage)}\n\n/* ---------- cover ---------- */\n.cover{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;position:relative;padding:90px 26px 70px;overflow:hidden}\n.cover__brand{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:8px;white-space:nowrap;font-size:15px;letter-spacing:.16em;color:var(--sage-deep);text-transform:uppercase;margin-bottom:6vh;font-weight:500}\n.cover__brand b{font-family:var(--font-display);font-weight:700;letter-spacing:.02em;text-transform:none;font-size:21px;color:var(--sage-ink)}\n.cover__sunmark{margin-bottom:30px}\n.eyebrow{font-size:16px;letter-spacing:.14em;color:var(--gold);font-weight:600;margin-bottom:18px}\n.cover__title{font-family:var(--font-display);font-weight:800;font-size:clamp(48px,11vw,104px);line-height:1.06;color:var(--sage-ink);margin-bottom:26px;letter-spacing:-.01em}\n.cover__sub{font-size:clamp(22px,3vw,32px);color:var(--ink);max-width:20ch;line-height:1.45;font-weight:500;margin-bottom:28px;text-wrap:balance}\n.cover__note{font-size:clamp(17px,1.7vw,21px);color:var(--ink-soft);max-width:34ch;line-height:1.65;margin-bottom:7vh;text-wrap:pretty}\n.cover__by{font-size:17px;color:var(--sage-deep)}\n.cover__by b{font-weight:700;color:var(--sage-ink)}\n.cover__by span{display:block;font-size:15px;color:var(--ink-soft);margin-top:3px}\n.scrollcue{position:absolute;bottom:30px;left:50%;transform:translateX(-50%);color:var(--sage);animation:bob 2.4s ease-in-out infinite}\n@keyframes bob{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(8px)}}\n\n/* ---------- section = page ---------- */\nsection.chap{padding:clamp(54px,8vh,92px) 0;position:relative}\n.chap>*{position:relative;z-index:1}\n.chap--alt::before{content:\"\";position:absolute;z-index:0;top:0;bottom:0;left:50%;transform:translateX(-50%);width:100vw;background:var(--cream-deep)}\n.chap__num{display:flex;align-items:baseline;gap:13px;font-size:14px;letter-spacing:.14em;color:var(--gold);font-weight:600;margin-bottom:16px}\n.pageno{font-family:var(--font-display);font-weight:800;font-size:clamp(32px,5.5vw,50px);color:var(--sage-soft);line-height:.85;letter-spacing:0}\n.chap__title{font-family:var(--font-display);font-weight:800;font-size:clamp(29px,4.8vw,42px);line-height:1.2;color:var(--sage-ink);margin-bottom:28px;text-wrap:balance}\n.lead{font-size:clamp(18px,2vw,21px);color:var(--ink);line-height:1.8;margin-bottom:22px;text-wrap:pretty}\np.body{margin-bottom:18px;text-wrap:pretty}\n.muted{color:var(--ink-soft)}\n.divider{display:flex;align-items:center;justify-content:center;gap:14px;padding:2vh 0;color:var(--sage-soft)}\n.divider::before,.divider::after{content:\"\";height:1px;width:54px;background:var(--line)}\n\n/* trigger list */\n.triggers{list-style:none;display:flex;flex-direction:column;gap:2px;margin:6px 0 30px;border-right:2px solid var(--sage-soft);padding-right:22px}\n.triggers li{font-family:var(--font-display);font-size:clamp(20px,3vw,26px);color:var(--sage-deep);line-height:1.6}\n\n/* soft / compassion box */\n.box{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:30px 32px;margin:26px 0;box-shadow:0 14px 40px rgba(94,110,86,.06)}\n.box--mist{background:var(--mist);border-color:#dde2d6}\n.box--peach{background:var(--peach-soft);border-color:#f1dcbf}\n.box--sage{background:var(--sage);border:none;color:#fff}\n.box__label{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);font-weight:600;margin-bottom:12px}\n.box--sage .box__label{color:rgba(255,255,255,.85)}\n.box p{text-wrap:pretty}\n.box--peach .big,.box--mist .big{font-family:var(--font-display);font-size:clamp(20px,3vw,25px);line-height:1.5;color:var(--sage-ink)}\n.box--sage .big{font-family:var(--font-display);font-size:clamp(22px,3.4vw,28px);line-height:1.45}\n\n/* checklist */\n.check{list-style:none;display:flex;flex-direction:column;gap:4px;margin-top:4px}\n.check li{margin:0}\n.check label{display:flex;align-items:flex-start;gap:14px;cursor:pointer;padding:13px 16px;border-radius:14px;transition:background .2s;font-size:clamp(17px,2vw,19px);line-height:1.5}\n.check label:hover{background:var(--mist)}\n.check input{position:absolute;opacity:0;width:0;height:0}\n.check .tick{flex:0 0 auto;width:26px;height:26px;border-radius:8px;border:2px solid var(--sage);display:grid;place-items:center;margin-top:1px;transition:.2s;background:var(--paper)}\n.check .tick svg{width:15px;height:15px;color:#fff;opacity:0;transform:scale(.5);transition:.2s}\n.check input:checked + .tick{background:var(--sage);border-color:var(--sage)}\n.check input:checked + .tick svg{opacity:1;transform:scale(1)}\n.check input:checked ~ .ctext{color:var(--ink-soft);text-decoration:line-through;text-decoration-color:var(--sage-soft)}\n\n/* self-check (yes/no + grounding) */\n.selfcheck{display:flex;flex-direction:column}\n.sc-q{padding:17px 2px;border-bottom:1px solid var(--line)}\n.sc-q:last-child{border-bottom:none;padding-bottom:2px}\n.sc-q.sc-head{padding-top:2px}\n.sc-ask{font-family:var(--font-body);font-weight:700;color:var(--sage-ink);font-size:clamp(18px,2.2vw,21px);line-height:1.5}\n.sc-q.sc-head .sc-ask{font-size:clamp(21px,2.7vw,25px)}\n.sc-sub{color:var(--ink-soft);font-size:15.5px;margin-top:5px;line-height:1.5}\n.sc-title{font-family:var(--font-display);font-weight:800;font-size:clamp(22px,3vw,27px);color:var(--sage-ink);margin:6px 0 14px;line-height:1.4}\n.sc-reveal{max-height:0;overflow:hidden;opacity:0;transition:max-height .38s ease,opacity .3s ease}\n.sc-reveal.open{max-height:260px;opacity:1;margin-top:14px}\n.sc-reveal .sc-sub{margin:0 0 8px;font-weight:600;color:var(--sage-deep)}\n.sc-row{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}\n.yn{display:inline-flex;gap:9px;flex:0 0 auto}\n.yn button{font-family:var(--font-body);font-size:16px;font-weight:600;color:var(--sage-deep);background:var(--paper);border:1.5px solid var(--sage-soft);border-radius:30px;padding:9px 26px;cursor:pointer;transition:.18s;min-width:66px}\n.yn button:hover{border-color:var(--sage)}\n.yn button.on{background:var(--sage);border-color:var(--sage);color:#fff}\n.sc-chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}\n.sc-chip{font-family:var(--font-body);font-size:14.5px;color:var(--sage-deep);background:var(--mist);border:1px solid var(--line);border-radius:30px;padding:8px 16px;cursor:pointer;transition:.18s}\n.sc-chip:hover{background:var(--sage-soft);color:var(--sage-ink)}\n.sc-q textarea{width:100%;border:1px solid var(--line);border-radius:13px;background:var(--paper);padding:13px 15px;font-family:var(--font-body);font-size:16.5px;color:var(--ink);line-height:1.6;resize:vertical;min-height:56px;margin-top:4px}\n.sc-q textarea:focus{outline:none;border-color:var(--sage);box-shadow:0 0 0 3px rgba(168,184,160,.25)}\n.sc-q textarea::placeholder{color:#b3ab98}\n\n/* quote / sentence cards */\n.cards{display:flex;flex-direction:column;gap:14px;margin:22px 0}\n.scard{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:22px 26px;position:relative;font-family:var(--font-display);font-style:italic;font-size:clamp(18px,2.4vw,22px);line-height:1.55;color:var(--sage-ink)}\n.scard::before{content:\"”\";position:absolute;top:6px;right:18px;font-family:var(--font-display);font-size:46px;color:var(--sage-soft);line-height:1}\n.scard span{display:block;padding-right:30px}\n\n/* labeled quote cards (שימוש 2) */\n.qcards{display:flex;flex-direction:column;gap:14px;margin:24px 0}\n.qcards .box{margin:0}\n.qcards .box__label{margin-bottom:9px}\n.qcards p{margin:0;font-family:var(--font-display);font-style:italic;color:var(--sage-ink);line-height:1.6;font-size:clamp(17px,2.2vw,20px)}\n.qcards q{quotes:\"\\201E\" \"\\201C\"}\n\n/* formula cards */\n.formula{display:flex;flex-direction:column;gap:16px;margin:28px 0}\n.fcard{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:26px 30px;display:flex;gap:22px;align-items:flex-start;box-shadow:0 10px 30px rgba(94,110,86,.05)}\n.fcard__k{flex:0 0 auto;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-family:var(--font-display);font-size:22px;color:#fff;background:var(--sage)}\n.fcard:nth-child(2) .fcard__k{background:var(--sage-deep)}\n.fcard:nth-child(3) .fcard__k{background:var(--gold)}\n.fcard__b h4{font-family:var(--font-display);font-weight:800;font-size:clamp(20px,2.6vw,24px);color:var(--sage-ink);margin-bottom:4px}\n.fcard__b p{font-size:16.5px;color:var(--ink-soft);line-height:1.6}\n\n/* exercise */\n.exercise{background:var(--mist);border-radius:22px;padding:30px 30px 34px;margin:30px 0}\n.exercise__head{display:flex;align-items:center;gap:10px;margin-bottom:6px}\n.exercise__head h4{font-family:var(--font-display);font-size:clamp(20px,2.6vw,24px);color:var(--sage-ink);font-weight:800}\n.exercise__sub{color:var(--ink-soft);font-size:16px;margin-bottom:20px}\n.field{margin-bottom:18px}\n.field label{display:block;font-weight:600;color:var(--sage-deep);margin-bottom:7px;font-size:16px}\n.field textarea{width:100%;border:1px solid var(--line);border-radius:13px;background:var(--paper);padding:14px 16px;font-family:var(--font-body);font-size:17px;color:var(--ink);line-height:1.6;resize:vertical;min-height:62px;transition:.2s}\n.field textarea:focus{outline:none;border-color:var(--sage);box-shadow:0 0 0 3px rgba(168,184,160,.25)}\n.field textarea::placeholder{color:#b3ab98}\n.saved-note{font-size:13.5px;color:var(--sage-deep);display:flex;align-items:center;gap:6px;opacity:0;transition:.3s}\n.saved-note.show{opacity:1}\n.ex-foot{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-top:8px;min-height:24px}\n.ex-actions{display:flex;gap:10px;flex-wrap:wrap}\n.ex-btn{display:inline-flex;align-items:center;gap:8px;white-space:nowrap;border:none;cursor:pointer;font-family:var(--font-body);font-weight:700;font-size:15px;padding:11px 18px;border-radius:30px;background:var(--sage-ink);color:#fff;transition:.2s}\n.ex-btn:hover{background:var(--sage-deep)}\n.ex-btn--ghost{background:transparent;color:var(--sage-deep);border:1.5px solid var(--sage)}\n.ex-btn--ghost:hover{background:var(--paper);color:var(--sage-ink)}\n.ex-hint{font-size:13.5px;color:var(--ink-soft);margin-top:14px;line-height:1.55}\n.ex-hint b{color:var(--sage-deep);font-weight:700}\n\n/* accordion */\n.acc{display:flex;flex-direction:column;gap:14px;margin:26px 0}\n.acc__item{border:1px solid var(--line);border-radius:18px;background:var(--paper);overflow:hidden;transition:box-shadow .25s}\n.acc__item.open{box-shadow:0 14px 38px rgba(94,110,86,.09)}\n.acc__btn{width:100%;text-align:right;background:none;border:none;cursor:pointer;padding:22px 26px;display:flex;align-items:center;gap:16px;font-family:var(--font-body)}\n.acc__tag{flex:0 0 auto;font-size:13px;letter-spacing:.08em;color:var(--gold);font-weight:600;text-transform:uppercase}\ 3)}\n\n/* formula badge pop-in */\n@media(prefers-reduced-motion:no-preference){\n  html.js .formula.reveal .fcard__k{transform:scale(.55);opacity:0;transition:transform .55s cubic-bezier(.2,.8,.3,1.25) .15s,opacity .4s ease .15s}\n  html.js .formula.reveal.in .fcard__k{transform:scale(1);opacity:1}\n  html.js .formula.reveal.in .fcard:nth-child(2) .fcard__k{transition-delay:.28s}\n  html.js .formula.reveal.in .fcard:nth-child(3) .fcard__k{transition-delay:.41s}\n}\n\n@media(max-width:560px){\n  .wrap{padding:0 20px}\n  .box{padding:24px 22px;border-radius:18px}\n  .fcard{padding:22px;gap:16px}\n  .fcard__k{width:54px;height:54px;font-size:19px}\n  .audio{padding:24px}\n}\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n\n\n<div class=\"topbar\"><div class=\"topbar__fill\" id=\"progress\"><\u002Fdiv><\u002Fdiv>\n\n<nav class=\"dotnav\" id=\"dotnav\" aria-label=\"ניווט פרקים\">\n  <a href=\"#cover\" data-label=\"שער\"><span>שער<\u002Fspan><\u002Fa>\n  <a href=\"#open\" data-label=\"פתיחה\"><span>פתיחה<\u002Fspan><\u002Fa>\n  <a href=\"#pause\" data-label=\"לפני שאני מסבירה\"><span>לפני שאני מסבירה<\u002Fspan><\u002Fa>\n  <a href=\"#formula\" data-label=\"הנוסחה\"><span>הנוסחה<\u002Fspan><\u002Fa>\n  <a href=\"#use1\" data-label=\"שימוש 1\"><span>שימוש 1<\u002Fspan><\u002Fa>\n  <a href=\"#use2\" data-label=\"שימוש 2\"><span>שימוש 2<\u002Fspan><\u002Fa>\n  <a href=\"#shelf\" data-label=\"השליף\"><span>השליף<\u002Fspan><\u002Fa>\n  <a href=\"#close\" data-label=\"חשוב לזכור\"><span>חשוב לזכור<\u002Fspan><\u002Fa>\n<\u002Fnav>\n\n<!-- ============ COVER ============ -->\n<header class=\"cover\" id=\"cover\" data-screen-label=\"שער\">\n  <img class=\"bot bot--cover-tr\" src=\"f4462540-d348-4187-a67d-ac0fc200d51e\" alt=\"\" aria-hidden=\"true\">\n  <img class=\"bot bot--cover-bl\" src=\"83935032-d01e-49e1-94f4-4a3ca6861509\" alt=\"\" aria-hidden=\"true\">\n\n  <div class=\"cover__brand reveal\"><span>Anchor<\u002Fspan> · <b>שיטת ע.ו.ג.ן<\u002Fb><\u002Fdiv>\n\n  <svg class=\"sun cover__sunmark reveal\" width=\"62\" height=\"42\" viewBox=\"0 0 62 42\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" aria-hidden=\"true\">\n    <line x1=\"31\" y1=\"2\" x2=\"31\" y2=\"12\"><\u002Fline>\n    <line x1=\"16\" y1=\"6\" x2=\"20\" y2=\"14\"><\u002Fline>\n    <line x1=\"46\" y1=\"6\" x2=\"42\" y2=\"14\"><\u002Fline>\n    <line x1=\"6\" y1=\"17\" x2=\"14\" y2=\"21\"><\u002Fline>\n    <line x1=\"56\" y1=\"17\" x2=\"48\" y2=\"21\"><\u002Fline>\n    <circle cx=\"31\" cy=\"32\" r=\"8\"><\u002Fcircle>\n  <\u002Fsvg>\n\n  <div class=\"eyebrow reveal\">בונוס #3<\u002Fdiv>\n  <h1 class=\"cover__title reveal\">כשאין לי מילים<\u002Fh1>\n  <p class=\"cover__sub reveal\">איך להגיד מה אני צריכה בזמן אמת<\u002Fp>\n  <p class=\"cover__note reveal\">בלי להתנצל, להיעלם או להתפוצץ.<br>בונוס קצר לתרגול תקשורת רגישה בזמן הצפה.<\u002Fp>\n  <p class=\"cover__by reveal\"><b>עם רותם כהני<\u002Fb><span>פסיכולוגית קלינית<\u002Fspan><\u002Fp>\n\n  <svg class=\"scrollcue\" width=\"26\" height=\"26\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\"><path d=\"M6 9l6 6 6-6\"><\u002Fpath><\u002Fsvg>\n<\u002Fheader>\n\n<main class=\"wrap\">\n\n  <!-- ============ 01 · פתיחה ============ -->\n  <section class=\"chap chap--alt\" id=\"open\" data-screen-label=\"פתיחה\">\n    <img class=\"side-bot sb-why\" src=\"586a021a-e6f9-4a32-b7af-16e9c2a50864\" alt=\"\" aria-hidden=\"true\">\n    <div class=\"chap__num reveal\"><span class=\"pageno\">01<\u002Fspan>פתיחה<\u002Fdiv>\n    <h2 class=\"chap__title reveal\">יש משהו מאתגר, ולפעמים גם כואב, ברגע שבו אנחנו צריכות להסביר מה עובר עלינו.<\u002Fh2>\n    <p class=\"lead reveal\">לא תמיד מדובר בדרמה גדולה.<\u002Fp>\n\n    <ul class=\"triggers reveal\">\n      <li>לפעמים זו הודעה קצרה מדי מחברה.<\u002Fli>\n      <li>או שיחה זוגית שבה משהו בטון מפעיל אותך.<\u002Fli>\n      <li>לפעמים זו ארוחה משפחתית רועשת מדי.<\u002Fli>\n      <li>או בקשה בעבודה שמציפה אותך כי כבר אין לך מרחב.<\u002Fli>\n      <li>ולפעמים זה פשוט קושי מתמשך: עומס, צורך ביותר בהירות, זמן, שקט או עדינות.<\u002Fli>\n    <\u002Ful>\n\n    <p class=\"body reveal\">ובדיוק במקומות האלה, הרבה פעמים עולה הקונפליקט: מצד אחד, אני רוצה שיבינו אותי. מצד שני, אני לא רוצה להרגיש \"יותר מדי\", להצטדק או לדבר על הרגישות שלי כאילו היא בעיה.<\u002Fp>\n    <p class=\"body reveal\">אז לפעמים אנחנו בולעות, מסבירות יותר מדי, מתנצלות עוד לפני שביקשנו משהו, מתרחקות או מתפרצות.<\u002Fp>\n    <p class=\"body reveal\">הבונוס הזה הוא לא רק על \"איך לדבר יפה\". הוא על איך <mark class=\"hl\">לתרגם את הרגישות שלך לשפה שאפשר לתקשר<\u002Fmark>. איך להגיד מה קורה לך ומה את צריכה, בזוגיות, בעבודה, במשפחה ובחיים החברתיים, בצורה שמגדילה את הסיכוי שיבינו אותך, בלי להצטמצם ובלי להתנצל.<\u002Fp>\n  <\u002Fsection>\n\n  <div class=\"pullquote reveal\">\n    <img class=\"pq-bot pq-bot--a\" src=\"a9e553ea-3a71-4859-adea-3a6b0d789594\" alt=\"\" aria-hidden=\"true\">\n    <img class=\"pq-bot pq-bot--b\" src=\"586a021a-e6f9-4a32-b7af-16e9c2a50864\" alt=\"\" aria-hidden=\"true\">\n    <svg class=\"pullquote__anchor\" viewBox=\"0 0 60 80\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\n      <circle cx=\"30\" cy=\"9\" r=\"5\"><\u002Fcircle>\n      <line x1=\"30\" y1=\"14\" x2=\"30\" y2=\"63\"><\u002Fline>\n      <line x1=\"18\" y1=\"24\" x2=\"42\" y2=\"24\"><\u002Fline>\n      <path d=\"M11 45 C11 64 30 67 30 67 C30 67 49 64 49 45\"><\u002Fpath>\n      <path d=\"M11 45 l-6 -1 M11 45 l4 -7\"><\u002Fpath>\n      <path d=\"M49 45 l6 -1 M49 45 l-4 -7\"><\u002Fpath>\n    <\u002Fsvg>\n    <p>הרגישות שלך לא צריכה להיעלם כדי שתוכלי להיות בקשר.<br>אבל לפעמים היא כן צריכה <span class=\"mark\">תרגום<\u002Fspan><br>כדי שתרגישי בטוחה.<\u002Fp>\n  <\u002Fdiv>\n  <section class=\"chap\" id=\"pause\" data-screen-label=\"לפני שאני מסבירה\">\n    <div class=\"chap__num reveal\"><span class=\"pageno\">02<\u002Fspan>רגע לפני<\u002Fdiv>\n    <h2 class=\"chap__title reveal\">לפני שאני מסבירה, אני רגע חוזרת לעצמי<\u002Fh2>\n    <p class=\"lead reveal\">לפני הניסוח, לפני ההסבר, לפני הבקשה, כדאי לעצור לרגע קטן. לא צריך להירגע לגמרי או למצוא את הניסוח המושלם, רק כדי לבדוק <mark class=\"hl--sage hl\">מאיזה מקום אני עומדת לשתף<\u002Fmark>.<\u002Fp>\n    <p class=\"body reveal\">יש הבדל בין לדבר מתוך חיבור וקרקע מסוימים, לבין לדבר מתוך הצפה, בהלה, או מגננה. אז נרצה לשאול את עצמינו:<\u002Fp>\n\n    <p class=\"sc-title reveal\">מה קורה בתוכי עכשיו<\u002Fp>\n    <div class=\"box box--mist reveal\">\n      <div class=\"selfcheck\" data-store=\"selfcheck-pause\">\n        <div class=\"sc-q\">\n          <div class=\"sc-row\">\n            <p class=\"sc-ask\">האם אני מספיק בנוכחות כדי לדבר?<\u002Fp>\n            <div class=\"yn\" data-k=\"q1\">\n              <button type=\"button\" data-v=\"yes\">כן<\u002Fbutton>\n              <button type=\"button\" data-v=\"no\">לא<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"sc-q\">\n          <div class=\"sc-row\">\n            <p class=\"sc-ask\">או שאני צריכה משהו לפני כדי לחזור לעצמי?<\u002Fp>\n            <div class=\"yn\" data-k=\"q2\" data-reveal=\"ret\">\n              <button type=\"button\" data-v=\"yes\">כן<\u002Fbutton>\n              <button type=\"button\" data-v=\"no\">לא<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"sc-reveal\" id=\"ret\">\n            <p class=\"sc-sub\">ואם כן, מה?<\u002Fp>\n            <textarea data-k=\"return\" placeholder=\"…\"><\u002Ftextarea>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <p class=\"body reveal\">לפעמים התשובה תהיה: <em>כן, אני יכולה לדבר עכשיו.<\u002Fem> ואז אפשר להשתמש בנוסחה שתכף נלמד. ולפעמים התשובה תהיה: <em>עוד לא.<\u002Fem> וזה לא אומר שנכשלת בתקשורת. זה אומר שהמערכת שלך צריכה קודם רגע של עוגן.<\u002Fp>\n\n    <div class=\"box reveal\">\n      <div class=\"box__label\">משפט מעבר קטן<\u002Fdiv>\n      <p class=\"muted\" style=\"margin-bottom:14px\">במצב כזה, לא חייבים להסביר הכול עכשיו. אפשר להתחיל ממשפט מעבר קטן, ששומר על קשר מבלי להכריח אותך לדבר לפני שאת מוכנה. למשל:<\u002Fp>\n      <div class=\"cards\" style=\"margin:0\">\n        <div class=\"scard\"><span>אני רוצה לענות לך ברור, אבל אני מרגישה שאני מוצפת עכשיו. אני צריכה כמה דקות ואז אחזור לזה.<\u002Fspan><\u002Fdiv>\n        <div class=\"scard\"><span>משהו בי קצת נסגר עכשיו, אבל חשוב לי לא להתרחק. אני צריכה רגע.<\u002Fspan><\u002Fdiv>\n        <div class=\"scard\"><span>אני שמה לב שאני מתחילה להתגונן, ואני לא רוצה לדבר מהמקום הזה. אפשר שנעצור רגע ונחזור לזה עוד מעט?<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <p class=\"body\" style=\"margin:18px 0 0\">לפעמים זה כל מה שצריך כדי לא להיעלם, לא להתפוצץ ולא לְרַצוֹת אוטומטית. רק להשאיר גשר קטן.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  \n\n  <!-- ============ 3 · FORMULA ============ -->\n  <section class=\"chap\" id=\"formula\" data-screen-label=\"הנוסחה\">\n    <img class=\"side-bot sb-formula\" src=\"ca89faf3-ca73-4b5d-a88f-893a11325c34\" alt=\"\" aria-hidden=\"true\">\n    <div class=\"chap__num reveal\"><span class=\"pageno\">03<\u002Fspan>הלב של הבונוס<\u002Fdiv>\n    <h2 class=\"chap__title reveal\">הנוסחה: גם + גם + בקשה<\u002Fh2>\n    <p class=\"lead reveal\">כשיש לנו קצת יותר קרקע, אפשר להשתמש ב<mark class=\"hl\">נוסחה פשוטה<\u002Fmark>:<\u002Fp>\n\n    <div class=\"formula reveal\">\n      <div class=\"fcard\">\n        <div class=\"fcard__k\">גם<\u002Fdiv>\n        <div class=\"fcard__b\"><h4>מה קורה בתוכי<\u002Fh4><p>מה אני מרגישה, קולטת, צריכה או חווה בפנים.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"fcard\">\n        <div class=\"fcard__k\">גם<\u002Fdiv>\n        <div class=\"fcard__b\"><h4>מה חשוב לי<\u002Fh4><p>מה חשוב לי לשמור, לאפשר או להביא: בקשר, בעבודה, בבית, בתפקוד או בערך שאני רוצה לחיות לפיו.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"fcard\">\n        <div class=\"fcard__k\">בקשה<\u002Fdiv>\n        <div class=\"fcard__b\"><h4>מה יעזור לי בפועל<\u002Fh4><p>משהו קטן, ברור, אפשרי ובר ביצוע.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <p class=\"body reveal\">הסיבה שהנוסחה הזאת חשובה היא שהיא מחזיקה שלושה דברים יחד. היא לא רק אומרת: <q>קשה לי.<\u002Fq> והיא גם לא רק אומרת: <q>תעשו בשבילי משהו.<\u002Fq> היא עוזרת לך לומר: זה מה שקורה לי. זה מה שחשוב לי. וזה מה שיעזור לי להישאר כאן בצורה טובה יותר. וזה הבדל גדול.<\u002Fp>\n    <p class=\"body reveal muted\">כי כשאנחנו רק מסבירות את הקושי, לפעמים הצד השני לא יודע מה לעשות עם זה. וכשאנחנו רק מבקשות משהו, בלי הקשר, הבקשה יכולה להישמע פתאומית או לא מובנת. אבל כשאנחנו מחברות בין החוויה הפנימית, הכוונה הטובה והבקשה הפרקטית, אנחנו מגדילות את הסיכוי שהצד השני יבין לא רק מה קשה לנו, אלא גם איך אפשר לעזור.<\u002Fp>\n\n    <div class=\"exercise reveal\">\n      <div class=\"exercise__head\">\n        <svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"var(--gold)\" stroke-width=\"1.8\" stroke-linecap=\"round\"><path d=\"M12 20h9\"><\u002Fpath><path d=\"M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z\"><\u002Fpath><\u002Fsvg>\n        <h4>נסי בעצמך<\u002Fh4>\n      <\u002Fdiv>\n      <p class=\"exercise__sub\">בחרי סיטואציה או קשר בחייך שהיית רוצה לתרגל עליו כאן את הנוסחה.<\u002Fp>\n      <form data-store=\"exercise-formula\" autocomplete=\"off\">\n        <div class=\"field\"><label>גם: מה קורה בתוכי<\u002Flabel><textarea data-k=\"e1\" placeholder=\"…\"><\u002Ftextarea><\u002Fdiv>\n        <div class=\"field\"><label>גם: מה חשוב לי<\u002Flabel><textarea data-k=\"e2\" placeholder=\"…\"><\u002Ftextarea><\u002Fdiv>\n        <div class=\"field\"><label>בקשה: מה יעזור לי בפועל<\u002Flabel><textarea data-k=\"e3\" placeholder=\"…\"><\u002Ftextarea><\u002Fdiv>\n        <div class=\"ex-foot\">\n          <div class=\"saved-note\" id=\"savedNote\"><svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 13l4 4L19 7\"><\u002Fpath><\u002Fsvg> נשמר ✓<\u002Fdiv>\n          <div class=\"ex-actions\">\n            <button type=\"button\" class=\"ex-btn ex-btn--ghost\" id=\"copyBtn\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"9\" y=\"9\" width=\"12\" height=\"12\" rx=\"2\"><\u002Frect><path d=\"M5 15V5a2 2 0 0 1 2-2h10\"><\u002Fpath><\u002Fsvg> <span>העתקת הניסוח שלי<\u002Fspan><\u002Fbutton>\n            <button type=\"button\" class=\"ex-btn\" id=\"dlBtn\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 3v12m0 0l-4-4m4 4l4-4\"><\u002Fpath><path d=\"M5 21h14\"><\u002Fpath><\u002Fsvg> <span>שמירה כקובץ<\u002Fspan><\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <p class=\"ex-hint\">מה שכתבת יישמר <b>אוטומטית בדפדפן הזה<\u002Fb> גם אחרי רענון. כדי לשמור את זה לתמיד, העתיקי את הניסוח או שמרי אותו כקובץ.<\u002Fp>\n      <\u002Fform>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  \n\n  <!-- ============ 04 · שימוש 1 ============ -->\n  <section class=\"chap chap--alt\" id=\"use1\" data-screen-label=\"שימוש 1\">\n    <img class=\"side-bot sb-examples\" src=\"a9e553ea-3a71-4859-adea-3a6b0d789594\" alt=\"\" aria-hidden=\"true\">\n    <div class=\"chap__num reveal\"><span class=\"pageno\">04<\u002Fspan>שימוש 1<\u002Fdiv>\n    <h2 class=\"chap__title reveal\">כשמשהו שקורה עכשיו בקשר מפעיל אותי<\u002Fh2>\n    <p class=\"lead reveal\">יש רגעים שבהם משהו בקשר מפעיל אותנו, למשל טון, שתיקה, מבט או תחושה שלא הבינו אותנו. הנוסחה עוזרת לנו <mark class=\"hl--sage hl\">לא להאשים, לא להיעלם ולא להצטמצם<\u002Fmark>, אלא להגיד מה קורה לנו, ומה יעזור לנו להישאר בקשר.<\u002Fp>\n\n    <p class=\"acc-hint reveal\"><svg width=\"17\" height=\"17\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M9 18l6-6-6-6\"><\u002Fpath><\u002Fsvg>לחצו כדי לפתוח את הדוגמאות<\u002Fp>\n    <div class=\"acc\">\n      <div class=\"acc__item reveal\">\n        <button class=\"acc__btn\" type=\"button\">\n          <span class=\"acc__tag\">בזוגיות<\u002Fspan>\n          <h4>כשיש שקט אחרי ששיתפתי משהו<\u002Fh4>\n          <svg class=\"acc__chev\" width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"><path d=\"M6 9l6 6 6-6\"><\u002Fpath><\u002Fsvg>\n        <\u002Fbutton>\n        <div class=\"acc__panel\"><div class=\"acc__inner\">\n          <p class=\"qline\">כשיש שקט אחרי שאני משתפת משהו, אני שמה לב שאני מתחילה להילחץ.\nחשוב לי לא להיסגר ולבדוק מה באמת קורה.\nאז יעזור לי אם תגיד לי אם אתה צריך רגע לחשוב, או אם יש משהו שחשוב שנדבר עליו.<\u002Fp>\n          <div class=\"acc__short\"><b>או בקצרה<\u002Fb><q>השקט הזה קצת מפעיל אותי. חשוב לי לא להמציא סיפור לבד בראש. אפשר שתגיד לי אם אתה פשוט צריך רגע?<\u002Fq><\u002Fdiv>\n        <\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"acc__item reveal\">\n        <button class=\"acc__btn\" type=\"button\">\n          <span class=\"acc__tag\">בחברות<\u002Fspan>\n          <h4>כשאני מקבלת תשובה קצרה<\u002Fh4>\n          <svg class=\"acc__chev\" width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"><path d=\"M6 9l6 6 6-6\"><\u002Fpath><\u002Fsvg>\n        <\u002Fbutton>\n        <div class=\"acc__panel\"><div class=\"acc__inner\">\n          <p class=\"qline\">כשאני מקבלת תשובה קצרה, אני שמה לב שאני מתחילה לפרש שאולי משהו לא בסדר.\nוגם חשוב לי לא להתרחק רק בגלל פרשנות שלי.\nאז אני רוצה לבדוק רגע, הכול בינינו בסדר, או שיש משהו שכדאי לדבר עליו?<\u002Fp>\n          <div class=\"acc__short\"><b>או בקצרה<\u002Fb><q>קלטתי שהתשובה שלך הייתה קצרה, ומשהו בי התחיל להילחץ. יכול להיות שזה בכלל לא קשור אליי, אבל רציתי לבדוק אם הכול בסדר בינינו.<\u002Fq><\u002Fdiv>\n        <\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"acc__item reveal\">\n        <button class=\"acc__btn\" type=\"button\">\n          <span class=\"acc__tag\">עם המשפחה<\u002Fspan>\n          <h4>כשכמה אנשים מדברים אליי יחד<\u002Fh4>\n          <svg class=\"acc__chev\" width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"><path d=\"M6 9l6 6 6-6\"><\u002Fpath><\u002Fsvg>\n        <\u002Fbutton>\n        <div class=\"acc__panel\"><div class=\"acc__inner\">\n          <p class=\"qline\">כשכמה אנשים מדברים אליי יחד, אני מרגישה שאני הולכת לאיבוד וקשה לי להישאר נוכחת.\nוגם באמת חשוב לי להיות איתכם ולא להתרחק.\nאז אני אקח כמה דקות שקט כדי לחזור לעצמי, ואז אחזור יותר פנויה.<\u002Fp>\n          <div class=\"acc__short\"><b>או בקצרה<\u002Fb><q>כשכולם מדברים אליי יחד, אני מתבלבלת וקשה לי להישאר איתכם. אני לוקחת כמה דקות שקט וחוזרת.<\u002Fq><\u002Fdiv>\n        <\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n\n        <\u002Fdiv>\n      \n    \n  <\u002Fsection>\n\n  \n\n  <!-- ============ 05 · שימוש 2 ============ -->\n  <section class=\"chap\" id=\"use2\" data-screen-label=\"שימוש 2\">\n    <img class=\"side-bot sb-nowords\" src=\"83935032-d01e-49e1-94f4-4a3ca6861509\" alt=\"\" aria-hidden=\"true\">\n    <div class=\"chap__num reveal\"><span class=\"pageno\">05<\u002Fspan>שימוש 2<\u002Fdiv>\n    <h2 class=\"chap__title reveal\">כשאני רוצה להסביר מראש מה עוזר לי להיות במיטבי<\u002Fh2>\n    <p class=\"lead reveal\">במצבים שנרצה להסביר מה יעזור לנו לעבוד, לתפקד, לבצע, או להקשיב יותר טוב. כאן הנוסחה עוזרת לבטא את המסר <q class=\"say\">ככה אני יכולה להיות נוכחת יותר ולהביא את היכולות שלי<\u002Fq>.<\u002Fp>\n    <p class=\"body reveal\">וזה חשוב במיוחד לאנשים רגישים, כי הרגישות לא רק מקשה. היא גם מביאה עומק, דיוק, הקשבה, יצירתיות ויכולת לקלוט דברים שאחרים מפספסים. אבל כדי שזה יקרה, אנחנו צריכות סביבה שמאפשרת למערכת שלנו לתפקד ולא להגיע ליותר מדי הצפה.<\u002Fp>\n    <p class=\"body reveal\">גם כאן נשתמש באותה נוסחה: מה קורה לי + מה חשוב לי להביא + ומה יעזור לי בפועל.<\u002Fp>\n\n    <div class=\"qcards reveal\">\n      <div class=\"box\">\n        <div class=\"box__label\">בעבודה<\u002Fdiv>\n        <p><q>קשה לי להתרכז כשיש הרבה רעש סביבי. אני רוצה לעשות את זה יסודי, אז יעזור לי זמן שקט למשימות שדורשות ריכוז.<\u002Fq><\u002Fp>\n      <\u002Fdiv>\n      <div class=\"box\">\n        <div class=\"box__label\">מול קולגה או מנהלת<\u002Fdiv>\n        <p><q>כשיש הרבה משימות יחד, אני מתפזרת. יעזור לי שנחליט מה הכי דחוף ומה יכול לחכות, כדי שאעשה את זה ברמה הגבוהה שאני יכולה.<\u002Fq><\u002Fp>\n      <\u002Fdiv>\n      <div class=\"box\">\n        <div class=\"box__label\">בחיים החברתיים<\u002Fdiv>\n        <p><q>אני אוהבת להיות איתכם, אבל מפגשים גדולים מתישים אותי מהר. יעזור לי לדעת מראש מה התוכנית, או לבוא לזמן קצר יותר.<\u002Fq><\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"box box--mist reveal\">\n      <div class=\"box__label\">כשהנוסחה נשמעת מתוסרטת מדי<\u002Fdiv>\n      <p>כשאנחנו לומדות שפה חדשה, במיוחד שפה של צורך, גבול, רגישות ובקשה, זה לא תמיד נשמע טבעי מהרגע הראשון. לפעמים זה מרגיש מלאכותי, וזה בסדר. תזכרי שהנוסחה גמישה ומה שחשוב זה שתקחי אותה ותנסחי אותה איך שמרגיש לך טבעי. למשל אם להגיד משהו כמו ״אני שמה לב שאני נהיית דרוכה״ מרגיש מלאכותי, אפשר פשוט להגיד: ״אני מתחילה להילחץ.״<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ 6 · SHELF ============ -->\n  <section class=\"chap chap--alt\" id=\"shelf\" data-screen-label=\"השליף\">\n    <img class=\"side-bot sb-shelf\" src=\"a9e553ea-3a71-4859-adea-3a6b0d789594\" alt=\"\" aria-hidden=\"true\">\n    <div class=\"chap__num reveal\"><span class=\"pageno\">06<\u002Fspan>שמרי קרוב<\u002Fdiv>\n    <h2 class=\"chap__title reveal\">שליף מהיר לסיכום<\u002Fh2>\n    <p class=\"lead reveal\">כל מה שצריך, בעמוד אחד. צלמי ושמרי בטלפון.<\u002Fp>\n\n    <div class=\"shelf reveal\">\n      <div class=\"shelf__eyebrow\">שליף תקשורת בזמן הצפה<\u002Fdiv>\n      <div class=\"shelf__title\">כשאין לי מילים<\u002Fdiv>\n      <div class=\"shelf__grid\">\n        <div class=\"shelf__block\">\n          <h5>כשאני מוצפת ולא יכולה לדבר עכשיו<\u002Fh5>\n          <p class=\"say\"><q>אני מוצפת כרגע, אבל חשוב לי להישאר בקשר. אני צריכה כמה דקות ואז אחזור לזה.<\u002Fq><\u002Fp>\n        <\u002Fdiv>\n        <div class=\"shelf__block\">\n          <h5>כשמשהו בקשר הפעיל אותי<\u002Fh5>\n          <p class=\"say\"><q>כשזה קורה, אני שמה לב שאני מתחילה להילחץ / להיסגר / להתגונן. וגם חשוב לי להישאר בקשר ולא להתרחק. אז יעזור לי אם…<\u002Fq><\u002Fp>\n        <\u002Fdiv>\n        <div class=\"shelf__block\">\n          <h5>כשאני רוצה להסביר מה עוזר לי לתפקד טוב יותר<\u002Fh5>\n          <p class=\"say\"><q>כשיש… אני מרגישה ש… וגם חשוב לי… אז מה שיעזור לי בפועל זה…<\u002Fq><\u002Fp>\n        <\u002Fdiv>\n        <div class=\"shelf__block\">\n          <h5>הגרסה הכי קצרה של הנוסחה<\u002Fh5>\n          <p class=\"q\">גם: מה קורה לי עכשיו?<\u002Fp>\n          <p class=\"q\">גם: מה חשוב לי לשמור, לאפשר או להביא?<\u002Fp>\n          <p class=\"q\">בקשה: מה יעזור לי בפועל?<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- audio -->\n    <div class=\"audio reveal\">\n      <div class=\"audio__top\">\n        <div class=\"audio__icon\">\n          <svg width=\"26\" height=\"26\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M11 5 6 9H2v6h4l5 4z\"><\u002Fpath><path d=\"M15.5 8.5a5 5 0 0 1 0 7\"><\u002Fpath><path d=\"M19 5a9 9 0 0 1 0 14\"><\u002Fpath><\u002Fsvg>\n        <\u002Fdiv>\n        <div class=\"audio__b\">\n          <div class=\"label\">תרגול אודיו<\u002Fdiv>\n          <h4>איך למצוא מילים כשמשהו בי מופעל<\u002Fh4>\n          <p>תרגול קצר שיעזור לך לעצור רגע, לזהות מה קורה בפנים, ולבחור משפט אחד פשוט שאפשר להגיד בזמן אמת, בלי להתנצל, להיעלם או להתפוצץ. אפשר להאזין בישיבה, בהליכה או לפני שיחה רגישה.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <p class=\"audio__note\">🎧 את קובץ האודיו תמצאי כהערה בשיעור עצמו, בתוך הקורס.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  \n\n<\u002Fmain>\n\n<!-- ============ CLOSING ============ -->\n<section class=\"closing wrap\" id=\"close\" data-screen-label=\"סיום\">\n  <div class=\"chap__num reveal\"><span class=\"pageno\">07<\u002Fspan>חשוב לזכור<\u002Fdiv>\n  <h2 class=\"chap__title reveal\" style=\"margin-bottom:26px\">חשוב לזכור<\u002Fh2>\n  <p class=\"body reveal\" style=\"max-width:54ch;margin:0 auto 16px\">גם תקשורת בהירה, רגישה ואחראית לא מבטיחה שהצד השני יבין אותנו. אין לנו שליטה על איך אדם אחר יגיב, כמה מקום יש לו, או עד כמה הוא מסוגל לפגוש אותנו ברגישות. אבל יש לנו השפעה על הדרך שבה אנחנו מביאות את עצמנו.<\u002Fp>\n  <p class=\"body reveal\" style=\"max-width:54ch;margin:0 auto 30px\">המטרה היא שאת תרגישי יותר שלמה עם איך שאת מבטאת את עצמך. שתבקשי בלי להתנצל על הצורך שלך. ושתגלי מי מסוגל להיות איתך שם.<\u002Fp>\n  <p class=\"body reveal\" style=\"margin:0 auto 18px\">כי יש הבדל בין:<\u002Fp>\n  <div class=\"vs reveal\">\n    <div class=\"vs__row bad\"><span class=\"tagm\">מקטין אותך<\u002Fspan>\"סליחה, אני כזאת, אני יודעת שאני מגזימה.\"<\u002Fdiv>\n    <div class=\"vs__row good\"><span class=\"tagm\">מחבר אותך<\u002Fspan>\"זה מה שקורה לי, וזה מה שיעזור לי להישאר כאן.\"<\u002Fdiv>\n  <\u002Fdiv>\n  <p class=\"body reveal\" style=\"margin:6px auto 30px\">הראשון מקטין אותך. השני מחבר אותך לעצמך ולקשר.<\u002Fp>\n  <p class=\"closing__final reveal\">את לא צריכה להעלים את הרגישות שלך כדי להישאר בקשר. את יכולה ללמוד <span class=\"mark\">לתרגם אותה<\u002Fspan> למה שיעזור לך, להישאר, לתפקד, להתקרב ולהביא את עצמך יותר באמת.<\u002Fp>\n  <div class=\"closing__sig reveal\">\n    <svg class=\"sun\" style=\"margin:0 auto 14px\" width=\"48\" height=\"32\" viewBox=\"0 0 62 42\" fill=\"none\" stroke=\"var(--gold)\" stroke-width=\"2\" stroke-linecap=\"round\" aria-hidden=\"true\"><line x1=\"31\" y1=\"2\" x2=\"31\" y2=\"12\"><\u002Fline><line x1=\"16\" y1=\"6\" x2=\"20\" y2=\"14\"><\u002Fline><line x1=\"46\" y1=\"6\" x2=\"42\" y2=\"14\"><\u002Fline><line x1=\"6\" y1=\"17\" x2=\"14\" y2=\"21\"><\u002Fline><line x1=\"56\" y1=\"17\" x2=\"48\" y2=\"21\"><\u002Fline><circle cx=\"31\" cy=\"32\" r=\"8\"><\u002Fcircle><\u002Fsvg>\n    <b>רותם כהני<\u002Fb> · פסיכולוגית קלינית<br>שיטת ע.ו.ג.ן · Anchor\n  <\u002Fdiv>\n  <div class=\"reveal\"><a class=\"bonuslink\" href=\"כשהילד שלך מוצף.html\">לבונוס #4 · כשהילד שלך מוצף<\u002Fa><\u002Fdiv>\n<\u002Fsection>\n\n<script>\n(function(){\n  /* ---- reveal on scroll (rect-based; reliable across environments) ---- */\n  var reveals=[].slice.call(document.querySelectorAll('.reveal'));\n  /* stagger: cascade siblings within the same parent */\n  var groups={};\n  reveals.forEach(function(el){\n    var p=el.parentNode; var id=p.__rid||(p.__rid=Math.random());\n    groups[id]=(groups[id]||0); el.__si=groups[id]++;\n    if(el.__si){ el.style.transitionDelay=Math.min(el.__si,5)*0.07+'s'; }\n  });\n  function revealCheck(){\n    var vh=window.innerHeight||document.documentElement.clientHeight;\n    for(var i=reveals.length-1;i>=0;i--){\n      var el=reveals[i];\n      var r=el.getBoundingClientRect();\n      if(r.top < vh*0.88 && r.bottom > 0){ el.classList.add('in'); reveals.splice(i,1); }\n    }\n  }\n  window.addEventListener('scroll',revealCheck,{passive:true});\n  window.addEventListener('resize',revealCheck);\n  revealCheck();\n  setTimeout(revealCheck,200);\n\n  /* ---- progress + dotnav active ---- */\n  var fill=document.getElementById('progress');\n  var dots=[].slice.call(document.querySelectorAll('.dotnav a'));\n  var secs=dots.map(function(a){return document.querySelector(a.getAttribute('href'));});\n  function onScroll(){\n    var h=document.documentElement;\n    var p=h.scrollTop/(h.scrollHeight-h.clientHeight||1);\n    fill.style.width=(p*100)+'%';\n    var mid=h.scrollTop+window.innerHeight*0.4;\n    var idx=0;\n    secs.forEach(function(s,i){ if(s && s.offsetTop<=mid) idx=i; });\n    dots.forEach(function(d,i){ d.classList.toggle('active',i===idx); });\n  }\n  window.addEventListener('scroll',onScroll,{passive:true});\n  window.addEventListener('resize',onScroll); onScroll();\n\n  /* ---- accordion ---- */\n  document.querySelectorAll('.acc__btn').forEach(function(btn){\n    btn.addEventListener('click',function(){\n      var item=btn.closest('.acc__item');\n      var panel=item.querySelector('.acc__panel');\n      var open=item.classList.contains('open');\n      if(open){ panel.style.maxHeight=null; item.classList.remove('open'); }\n      else{ item.classList.add('open'); panel.style.maxHeight=panel.scrollHeight+'px'; }\n    });\n  });\n\n  /* ---- persistence: checkboxes ---- */\n  document.querySelectorAll('[data-store]').forEach(function(node){\n    var key='anchor-bonus3-'+node.getAttribute('data-store');\n    var data={};\n    try{ data=JSON.parse(localStorage.getItem(key)||'{}'); }catch(e){}\n    node.querySelectorAll('input[type=checkbox][data-k]').forEach(function(inp){\n      if(data[inp.dataset.k]) inp.checked=true;\n      inp.addEventListener('change',function(){\n        data[inp.dataset.k]=inp.checked;\n        localStorage.setItem(key,JSON.stringify(data));\n      });\n    });\n    /* yes/no segmented controls */\n    node.querySelectorAll('.yn[data-k]').forEach(function(grp){\n      var k=grp.dataset.k;\n      function paint(){grp.querySelectorAll('button').forEach(function(b){b.classList.toggle('on',b.dataset.v===data[k]);});var rid=grp.dataset.reveal;if(rid){var box=document.getElementById(rid);if(box)box.classList.toggle('open',data[k]==='yes');}}\n      paint();\n      grp.querySelectorAll('button').forEach(function(b){\n        b.addEventListener('click',function(){\n          data[k]=(data[k]===b.dataset.v)?null:b.dataset.v;\n          localStorage.setItem(key,JSON.stringify(data));\n          paint();\n        });\n      });\n    });\n    var note=document.getElementById('savedNote');\n    var t;\n    node.querySelectorAll('textarea[data-k]').forEach(function(ta){\n      if(data[ta.dataset.k]!=null) ta.value=data[ta.dataset.k];\n      ta.addEventListener('input',function(){\n        data[ta.dataset.k]=ta.value;\n        localStorage.setItem(key,JSON.stringify(data));\n        if(note){ note.classList.add('show'); clearTimeout(t); t=setTimeout(function(){note.classList.remove('show');},1600); }\n      });\n    });\n  });\n\n  /* ---- exercise: copy & download ---- */\n  function exerciseText(){\n    function v(k){var t=document.querySelector('textarea[data-k='+k+']');return (t&&t.value.trim())||'…';}\n    return 'הניסוח שלי · גם + גם + בקשה\\n\\n'+\n      'גם: מה קורה בתוכי\\n'+v('e1')+'\\n\\n'+\n      'גם: מה חשוב לי\\n'+v('e2')+'\\n\\n'+\n      'בקשה: מה יעזור לי בפועל\\n'+v('e3')+'\\n\\nמתוך הבונוס \"כשאין לי מילים\" · רותם כהני';\n  }\n  function flash(btn,msg){\n    var span=btn.querySelector('span'); if(!span) return;\n    var orig=span.textContent; span.textContent=msg;\n    setTimeout(function(){span.textContent=orig;},1800);\n  }\n  var copyBtn=document.getElementById('copyBtn');\n  if(copyBtn) copyBtn.addEventListener('click',function(){\n    var txt=exerciseText();\n    function ok(){flash(copyBtn,'הועתק ✓');}\n    if(navigator.clipboard&&navigator.clipboard.writeText){\n      navigator.clipboard.writeText(txt).then(ok).catch(function(){fallback(txt);ok();});\n    }else{fallback(txt);ok();}\n    function fallback(t){var ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');}catch(e){}document.body.removeChild(ta);}\n  });\n  var dlBtn=document.getElementById('dlBtn');\n  if(dlBtn) dlBtn.addEventListener('click',function(){\n    var blob=new Blob(['\\ufeff'+exerciseText()],{type:'text/plain;charset=utf-8'});\n    var url=URL.createObjectURL(blob);\n    var a=document.createElement('a');a.href=url;a.download='הניסוח שלי.txt';\n    document.body.appendChild(a);a.click();document.body.removeChild(a);\n    setTimeout(function(){URL.revokeObjectURL(url);},1000);\n    flash(dlBtn,'נשמר ✓');\n  });\n\n  /* ---- grounding chips: append to the textarea ---- */\n  var groundChips=document.getElementById('groundChips');\n  if(groundChips){\n    var gta=document.querySelector('textarea[data-k=ground]');\n    groundChips.querySelectorAll('.sc-chip').forEach(function(chip){\n      chip.addEventListener('click',function(){\n        if(!gta) return;\n        var v=gta.value.trim();\n        var add=chip.textContent.trim();\n        if(v.split(/[,\\n]/).map(function(s){return s.trim();}).indexOf(add)>-1) return;\n        gta.value = v ? (v.replace(/[,\\s]+$/,'')+', '+add) : add;\n        gta.dispatchEvent(new Event('input',{bubbles:true}));\n        gta.focus();\n      });\n    });\n  }\n})();\n<\u002Fscript>\n\n\n\n<\u002Fbody><\u002Fhtml>"
